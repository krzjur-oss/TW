name: Publikacja na GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skonfiguruj Bun
        uses: oven-sh/setup-bun@v2

      - name: Zainstaluj zależności
        run: bun install

      - name: Sprawdź typy TypeScript (lint)
        run: bun run lint

      - name: Uruchom testy automatyczne
        run: bun run test

      - name: Zbuduj aplikację PWA
        run: bun run build

      - name: Przygotuj artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
